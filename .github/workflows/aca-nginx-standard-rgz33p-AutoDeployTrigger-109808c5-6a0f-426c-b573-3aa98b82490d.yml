name: Trigger auto deployment for aca-nginx-standard-rgz33p

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/aca-nginx-standard-rgz33p-AutoDeployTrigger-109808c5-6a0f-426c-b573-3aa98b82490d.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.ACANGINXSTANDARDRGZ33P_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.ACANGINXSTANDARDRGZ33P_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.ACANGINXSTANDARDRGZ33P_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: docker.io
          registryUsername: ${{ secrets.ACANGINXSTANDARDRGZ33P_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.ACANGINXSTANDARDRGZ33P_REGISTRY_PASSWORD }}
          containerAppName: aca-nginx-standard-rgz33p
          resourceGroup: rg-aca-lab-RGZ33P
          imageToBuild: fitosdavid/aca-nginx-standard-rgz33p:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


